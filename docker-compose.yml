services:
  db:
    image: postgres:16-alpine
    container_name: flux-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flux_db}
      POSTGRES_USER: ${POSTGRES_USER:-flux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flux_user} -d $${POSTGRES_DB:-flux_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flux_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flux-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flux_user}:${POSTGRES_PASSWORD:-flux_password}@db:5432/${POSTGRES_DB:-flux_db}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - flux_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flux-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - flux_net

volumes:
  postgres_data:
    name: flux_postgres_data

networks:
  flux_net:
    name: flux_internal_network
